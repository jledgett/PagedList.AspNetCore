
name: Build and Publish NuGet Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Pack NuGet package
        run: dotnet pack src/PagedList.AspNetCore/PagedList.AspNetCore.csproj --configuration Release --output ./nupkg

      - name: NuGet Trusted Publishing Login
        uses: NuGet/login@v1
        id: login
        with:
          user: edgett

      - name: Publish to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
